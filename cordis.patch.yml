# dsh-improvements bundle patch —— 整个改进包只占一行。
#
# 五个模块共用这一行的 config；每个键都可以写 false 单独关掉，或写对象透传给模块。
# 模块代码本身不读这一行，装配层在 index.js 里按这里的键分发。
- insert:
    - id: dsh-improvements
      name: dsh-improvements
      config:
        # 破坏性命令护栏（Host）。false 关闭；也可用环境变量 DSH_GUARD=off。
        guard: true

        # 会话跨工作区移动 / 目录改名后重连（Host + 右键菜单）。
        # 只对 DSH 0.2.2-rc.3 开放；版本或私有接口不符时整组操作返回 503，不动会话文件。
        indexAdjust: true

        # MCP 渐进披露（Host + 设置页）。
        # stateFile 记录"上次看到的服务器"，用于识别配置被整文件重写的情况。
        mcpLazy:
          stateFile: "~/.dsh/mcp-lazy-state.json"
          # 每个 MCP 服务器一行简介，例如：
          # servers:
          #   rea: 逆向工程与二进制分析
          servers: {}

        # 桌面/浏览器操作工具（Host + Python 常驻服务）。
        computerUse: true

        # 上下文占用面板与 /context 命令（Client 为主，Host 半为空实现）。
        contextUsage: true
